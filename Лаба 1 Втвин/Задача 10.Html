<h1>«Странные» буквы</h1>
<img src="img 1L/task10.png" alt="Здесь бедет выведен текст, если вдруг картинка не загрузится">
<p>В современном русском языке не склоняются:</p>
<ul>
<li>иннициальные аббревиатуры (состаленные из первых букв слов), кончающиеся гласным, напрмер: <abbr title="Белорусский государственный университет информатики и радиоэлектроники">БГУИР</abbr>,<abbr title="Открытое Акционерное Общество">OAO</abbr>;</li>
<li>заимствованный аббревиатуры, кончающиеся твердым согласным, например: <abbr title="Чел какой-то">MAN</abbr>.</li>
</ul>
